version: 2
updates:
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: weekly
      day: 'friday'
      time: '08:00'
      timezone: Europe/Paris
    open-pull-requests-limit: 10
    allow:
      - dependency-name: '*'
        dependency-type: 'all'
    groups:
      arkui:
        patterns:
          - '@ark-ui/*'
      storybook:
        patterns:
          - 'storybook'
          - '@storybook/*'
      pandacss:
        patterns:
          - '@pandacss/*'
      lint:
        patterns:
          - 'oxlint'
          - 'oxfmt'
          - 'eslint-plugin-perfectionist'
          - '@stylistic/*'
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: weekly
      day: 'friday'
      time: '08:00'
      timezone: Europe/Paris
