name: 'Chromatic'

# Manual only: the visual regression baseline is not set up yet.
# Switch back to `on: push` once CHROMATIC_PROJECT_TOKEN is configured.
on: workflow_dispatch

jobs:
  chromatic:
    name: Chromatic
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install
        uses: ./.github/composite-actions/install

      - name: Run Chromatic
        uses: chromaui/action@latest
        with:
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          workingDir: packages/components
