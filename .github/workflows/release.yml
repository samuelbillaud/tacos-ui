name: Publish

on:
  push:
    paths:
      - '.changeset/**'
      - 'packages/**'
    branches:
      - main

permissions:
  contents: write
  pull-requests: write
  # Lets npm authenticate the publish through trusted publishing, no token.
  id-token: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install
        uses: ./.github/composite-actions/install

      - name: Build packages
        run: pnpm build

      - name: Publish packages
        id: changesets
        uses: changesets/action@v2
        with:
          publish-script: pnpm release
          github-token: ${{ secrets.GITHUB_TOKEN }}
