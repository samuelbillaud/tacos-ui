name: 'Install'
description: 'Sets up Node.js and runs install'

runs:
  using: composite
  steps:
    # No `version` input: pnpm/action-setup reads the `packageManager`
    # field from package.json, keeping CI and local installs in sync.
    - uses: pnpm/action-setup@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version-file: '.nvmrc'
        registry-url: 'https://registry.npmjs.org'
        cache: 'pnpm'

    - name: Setup Git User
      shell: bash
      run: |
        git config --global user.email "samuel.billaud@mergify.com"
        git config --global user.name "Samuel Billaud"

    - name: Install dependencies
      shell: bash
      run: pnpm install
