packages:
  - 'apps/**'
  - 'packages/**'

# @pandacss/studio pulls its own react 18.2.0, and two react copies break SSR.
overrides:
  react: 19.2.8
  react-dom: 19.2.8

# pnpm 10+ requires build scripts to be allowed explicitly.
allowBuilds:
  '@swc/core': true
  esbuild: true
  sharp: true
  workerd: true
